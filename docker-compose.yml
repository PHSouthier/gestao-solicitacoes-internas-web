name: gestao-solicitacoes-internas-web

services:
  web:
    build:
      context: .
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10

networks:
  default:
    name: gestao-net
    external: true
